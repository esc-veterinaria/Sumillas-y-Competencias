  { name:"MV-0105 Quimica", text:"Curso perteneciente al área de Estudios Generales. Asignatura de naturaleza teórico-práctica, imparte los contenidos básicos de la química necesarios para el desarrollo de la capacidad de comprensión de los procesos bioquímicos y físico-químicos de la producción y la clínica veterinaria despertando el interés a la explicación de los fenómenos naturales. Comprende el estudio de las propiedades físicas y de las reacciones químicas y biológicas de los compuestos orgánicos e inorgánicos del sistema vivo y su efecto sobre el medio ambiente. Incluye nociones fundamentales de la química nuclear." },
  { name:"MV-0108 Introducción a las Ciencias Veterinarias", text:"Curso perteneciente al área de Formación Profesional Básica. Asignatura de naturaleza teórico-práctico que tiene como propósito orientar al estudiante en adquirir una visión integral de la profesión médico veterinaria, proporcionándole conocimientos básicos sobre los objetivos de la carrera y las áreas de actividad medico veterinaria en un marco de interrelación ética con la comunidad y el medio ambiente." },
  { name:"MV-0109 Manejo de Animales Menores", text:"Curso perteneciente al área de Formación Profesional Básica. Asignatura de naturaleza teórica- práctica, tiene como objetivo brindar conocimientos para el desarrollo de habilidades y destrezas en las diferentes maniobras, procedimientos y protocolos que se realizan en la práctica profesional en animales de compañía, que incluye el uso de métodos alternativos en la enseñanza de la medicina veterinaria." },
  { name:"MV-0212 Bioquímica Animal", text:"Curso perteneciente al área de Formación Profesional Básica. Curso es de naturaleza teórico-práctica, tiene como objetivo el estudio de la estructura, función y metabolismo de las biomoléculas, entre ellas: agua, carbohidratos y lípidos y su interrelación explicando los diversos procesos metabólicos del organismo animal y sus mecanismos hormonales de la regulación metabólica orientados al área clínica veterinaria y nutrición animal. Comprende áreas temáticas como: propiedades físicas y químicas e importancia biológica del agua, la estructura, función, metabolismo e importancia de los carbohidratos y lípidos." },
  { name:"MV-209 Biología Celular", text:"Curso perteneciente al área de Estudios Generales. Curso de naturaleza teórico-práctica que tiene como objetivo brindar información actualizada, integral y organizada de la estructura y composición química de la Célula. Las células constituyen las unidades estructurales y funcionales básicas de los organismos, donde se realizan las reacciones vitales para dar origen a la vida. Se busca que el alumno alcance un buen nivel de comprensión de la integración, interdependencia de las biomoléculas, compartimentalización celular y funcionamiento de las organelas celulares. La asignatura, es de naturaleza teórico-práctica y está dividida en tres unidades temáticas: 1. Origen de la Vida. La célula. Biomoléculas. Membrana Biológica; 2. Procesos celulares. Organelas. División celular y 3.  Ácidos Nucleicos. Flujo de la información genética. Biología molecular aplicada." },
  { name:"MV-0210 Zootecnia General", text:"Curso perteneciente al área de Formación Profesional Básica. Curso de naturaleza teórico-práctica que tiene como objetivo proporcionar conocimientos básicos de las tecnologías de la Producción Animal en el Perú, así como de los sistemas productivos y su funcionamiento. Conceptos de razas, tipos y su utilidad en campo ganadero en cada grupo productivo como rumiantes mayores y menores (bovinos, ovinos, caprinos y camélidos sudamericanos), monogastricos (equinos y porcinos), además de otras especies (aves de producción, cuyes, y conejos)." },
  { name:"MV-0308 Anatomía Veterinaria", text:"Curso perteneciente al área de Formación Profesional Básica. Curso de naturaleza teórico-práctica que tiene como objetivo proporcionar conocimientos sobre los aspectos fundamentales de la morfología externa y la estructura macroscópica del cuerpo de los animales domésticos, ejercitando al alumno en la disección como método de estudio e investigación anatómica; asimismo se propone el correlato funcional y clínico con la producción animal. Comprende la organización anatómica de los sistemas corporales de los animales domésticos y los conceptos básicos de su funcionamiento." },
  { name:"MV-0309 Histología Veterinaria", text:"Curso perteneciente al área de Formación Profesional Básica. Curso de naturaleza teórico-práctica que tiene como objetivo el estudio de la organología animal observada a través de la microscopía. Tiene como objetivo desarrollar la capacidad de identificar y diferenciar la estructura detallada de los tejidos fundamentales, sus variantes y sus relaciones y funciones. Permite conocer y diferenciar los diversos órganos, aparatos y sistemas, su organización terminal y funcional bajo el aspecto microscópico, señalando las principales diferencias entre algunas especies de animales domésticos. Incentiva al estudio de la patología microscópica en la formación del Médico Veterinario. Contenidos: - Definición, origen, clasificación, distribución y función de los tejidos animales. Histología diferencial entre algunas especies de animales domésticos. Estudia la organología animal observada a través del microscopio." },
  { name:"MV-0305 Bioestadística", text:"Curso perteneciente al área de Formación Profesional Básica. Curso de naturaleza teórico-práctica que tiene como objetivo es el estudio de los métodos y procedimientos para la colección, clasificación, presentación, análisis e interpretación de datos observados en los fenómenos biológicos, y para la inferencia estadística a partir de ellos, propiciando su aplicación y el desarrollo del interés en la lectura y el análisis crítico de la literatura científica. Comprende pruebas estadísticas paramétricas y no paramétricas de mayor uso en la producción, la sanidad animal y la salud pública veterinaria." },
  { name:"MV-0310 Biofisica aplicada a las ciencias veterinarias", text:"Curso perteneciente al área de Formación Profesional Básica. Curso de naturaleza teórico-práctica que tiene como objetivo el estudio de los principios y leyes que rigen los fenómenos físicos que permiten entender las propiedades físicas de la materia, la energía, las interacciones entre ellas y los seres vivos, la medición de sus manifiestos y efectos, así como el funcionamiento de los aparatos comunes, diseñados para ello, haciendo énfasis en su aplicación en las Ciencias Veterinarias." },
  { name:"MV-0403 Diseño Experimental", text:"Curso perteneciente al área de Formación Profesional Básica. Curso de naturaleza teórico-práctica que tiene como objetivo responder a la necesidad del reconocimiento de los métodos básicos del diseño experimental como introducción a los métodos de investigación en áreas de las ciencias veterinarias estimulando el interés para proseguir con análisis más complejos. Se expone los diferentes tipos de experimentos, diseños experimentales y pruebas de significación estadística." },
  { name:"MV-0408 Deontología y Legislación Veterinaria", text:"Curso perteneciente al área de Formación Complementaria. Curso de naturaleza teórica que tiene por objetivo dar a conocer las normas ético-morales para el ejercicio de la Medicina Veterinaria, desarrollando valores inherentes al quehacer de la profesión. Comprende el estudio de la Ley 16200 del ejercicio de la profesión Médico Veterinaria y el Estatuto del Colegio Médico Veterinario del Perú. Brinda al estudiante una visión de las políticas públicas relacionadas al comercio de animales y productos derivados, como los códigos de animales terrestres y acuícolas." },
  { name:"MV-0410 Fisiología Veterinaria", text:"Curso perteneciente al área de Formación Profesional Básica. Curso naturaleza teórico-práctico, que tiene por objetivo proporcionar al estudiante conocimientos sobre el funcionamiento de los diferentes órganos, aparatos, sistemas y los mecanismos que permiten la regulación e integración de dichas funciones en el organismo animal, permitiéndole comprender el funcionamiento armónico de los diferentes sistemas. Comprende los siguientes temas: Fisiología de la membrana celular, Fisiología de los tejidos excitables, Fisiología de los líquidos circulantes, Fisiología del sistema cardiovascular y respiratorio, Fisiología del sistema digestivo, Fisiología del sistema renal y Fisiología del sistema hormonal." },
  { name:"MV-0409 Gestión y Economia Veterinaria", text:"Curso perteneciente al área de Formación Profesional Básica. de naturaleza teórica-practica que tiene por objetivo desarrollar y aplicar los aspectos básicos de la contabilidad, gestión, aplicadas a los campos de las Ciencias Veterinarias, permitiendo competencia en aspectos ecónomo-contables y legales  previos  necesarios  para  una  gestión  empresarial  eficiente.  Comprende  conceptos fundamentales de macro y micro economía. Oferta y demanda, análisis de costos y mercado de productos. Registro contable, balances y toma de decisiones en las empresas del sector." },
  { name:"MV-0411 Agrostología", text:"ACurso perteneciente al área de Formación Profesional Básica. La asignatura de carácter teórico- práctico que tiene como objetivo del estudio de las especies forrajeras con las que el ganado se alimenta en el sitio de crianza, clasificando manejo y utilización. Tiene como objetivo proporcionar al alumno los criterios básicos para el reconocimiento de pastizales, su morfología y el manejo adecuado de la producción de forraje y la calidad de la alimentación pecuaria. Identificación de las condiciones agroecológicas para el uso de las diferentes especies forrajeras." },
  { name:"MV-0412 Genetica y Mejoramiento Animal", text:"Curso perteneciente al área de Formación Profesional Básica. El curso naturaleza teórico-práctico que tiene como objetivo el estudio de los principios fundamentales de la herencia y su variabilidad en los seres vivos, sus bases materiales y su aplicación práctica. Tiene como objetivo impartir los conceptos y la metodología propios del análisis genético de organismos de origen animal que permitan explicar los procesos evolutivos y su aplicación en el mejoramiento animal. Mejoramiento Animal se ocupa del estudio de la evaluación genética de poblaciones animales y de las interacciones entre genes y medio ambiente. Tiene como objetivo introducir al alumno en la metodología de la evaluación genética de animales, con métodos para aprovechar diferentes efectos de los genes en la optimización de programas de mejoramiento animal, estimulando el desarrollo de la industria pecuaria del país." },
  { name:"MV-0413 Practica Pre-Profesional I", text:"Curso perteneciente al área de Formación Complementaria. El curso naturaleza práctica que tiene como objetivo realizar una Práctica de campo, que enfrenta al alumno desde inicio de la carrera con los diferentes aspectos de la actividad veterinaria. El grado de responsabilidad en las prácticas está de acuerdo con el nivel de conocimiento alcanzado en las aulas." },
  { name:"MV-0503 Microbiología Veterinaria", text:"Curso perteneciente al área de Formación Profesional Especializada. El curso naturaleza práctica que tiene como objetivo el estudio de la estructura, fisiología, genética y factores de virulencia de los agentes infecciosos de importancia en Medicina Veterinaria, que conduzcan a su diagnóstico e identificación. Proporciona conceptos generales sobre la participación de los microorganismos en el mantenimiento de la vida en el planeta y nociones del rol de ellos en la Biotecnología e induce a la investigación y al reconocimiento de los agentes microbianos en la causalidad de las enfermedades infecciosas. Comprende el estudio de Hongos, Bacterias, Virus y Priones; además, de principios de Biotecnología." },
  { name:"MV-0504 Inmunología Veterinaria", text:"Curso perteneciente al área de Formación Profesional Especializada. El curso de naturaleza teórico- práctico que tiene como objetivo el estudio de los diversos mecanismos inmunológicos, tanto a nivel celular como humoral, que presentan los organismos animales y que son usados como respuesta a la acción de diversos agentes externos e internos, que permite reconocer y explicar los procesos de resistencia de los animales a inmunógenos. Comprende: Respuesta inmune, Evolución del sistema inmunitario, Reacción antígeno-anticuerpo, Inmunoglobulinas, Formación de los anticuerpos, Complemento, Hipersensibilidad y Enfermedades autoinmunes." },
  { name:"MV-0509 Teriogenología", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo estudiar la reproducción del macho y la hembra, incluyendo fisiología y patología del aparato reproductivo, la práctica clínica, obstetricia, ginecología, andrología, espermatología y biotecnologías reproductivas." },
  { name:"MV-0507 Alimentación y Nutrición Animal", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo comprender el rol de los nutrientes en los procesos metabólicos de los alimentos, su efecto sobre la salud animal y su uso adecuado en la formulación de raciones. Comprende las transformaciones bioquímicas y de la degradación de los alimentos, los procesos metabólicos de los nutrientes y las alteraciones nutricionales que afectan la salud y la producción de los animales domésticos. Identifica nutrientes, determina los requerimientos nutritivos de los animales y formula raciones balanceadas para optimizar la producción animal. Comprende las necesidades nutritivas y de alimentación de los animales." },
  { name:"MV-0510 Industrializacion de los productos de origen animal", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo capacitar al estudiante para reconocer las características óptimas de la leche, la carne, huevos y aplicar los procesos tecnológicos en la Industria Alimentaría para la producción de sus derivados, incentivando la aplicabilidad en la elaboración de sub-productos lácteos y cárnicos. Desarrolla todos los procesos industriales para la creación de insumos para consumo humano bajo requerimientos de alta calidad. Se trata temas como: Análisis de calidad de la materia prima (leche y carne) para su industrialización; Buenas Prácticas de Higiene durante el proceso de producción. Fabricación de subproductos de leche y carne." },
  { name:"MV-0506 Farmacología y Toxicología Veterinaria", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo permitir al estudiante interpretar la farmacodinamia y farmacocinética de los fármacos y sustancias tóxicas, endógenas y exógenas en medicina veterinaria y los riesgos de las terapias inadecuadas, iatrogenia, interiorizando el concepto de prescripción y dosificación adecuada. Comprende conceptos básicos de farmacología y toxicología. Uso adecuado de sustancias medicamentosas. Sustancias tóxicas. Antídotos." },
  { name:"MV-0605 Patología Veterinaria I ", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo el enfoque sistémico que se ocupa de las alteraciones ocurridas a nivel de células, órganos, aparatos y sistemas. Tiene por objetivo analizar y asociar las alteraciones y relacionarlas con sus causas dando lugar al diagnóstico, explicando los mecanismos de acción de las noxas en los procesos patológicos. Trata sobre los conceptos básicos de la patología, alteraciones y neoplasias del sistema urinario y patogenia del sistema reproductor." },
  { name:"MV-0608 Enfermedades Infecciosas de los Animales Domesticos", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo identificar, diagnosticar y aplicar medidas terapéuticas y de control de las principales enfermedades infecciosas de mayor importancia en el Perú que afectan a los animales de producción, de compañía, y silvestres. Comprende la aplicación de los conocimientos fundamentales sobre características morfológicas, culturales, bioquímicas, moleculares y ecología de los agentes infecciosos de importancia en Medicina Veterinaria, y el estudio de las enfermedades producidas por estos agentes infecciosos: etiología, patogenia, examen anátomo-patológico, respuesta inmune, epidemiología y su importancia en la salud pública a fin de poder realizar los adecuados tratamientos y aplicaciones de medidas de control y prevención. Desarrolla criterios para el diagnóstico diferencial." },
  { name:"MV-0609 Formulación de proyectos en Ciencias Veterinarias", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo desarrollar conocimientos en los alumnos, que le permitan competencia en el proceso de elaboración de proyectos de salud animal y salud pública, su desarrollo desde la identificación del problema a la evaluación del impacto de la intervención." },
  { name:"MV-0610 Parasitología y Enfermedades Parasitarias", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo la identificación y diagnóstico, tratamiento y control de las principales enfermedades parasitarias que afectan a los animales de producción, de compañía, y silvestres de mayor importancia en el Perú. Comprende la aplicación de los conocimientos fundamentales sobre la fisiopatología, ciclos biológicos y ecología de los parásitos de importancia en Medicina Veterinaria. El estudio de las enfermedades producidas por estos agentes parasitarios: etiología, patogenia, examen anátomo-patológico, respuesta inmune, epidemiología e importancia en salud pública a fin de poder realizar los adecuados tratamientos y aplicaciones de medidas de control y prevención. Determina puntos críticos de los ciclos evolutivos de los parásitos para su control y eliminación." },
  { name:"MV-0612 Anestesiología y Preoperatoria", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo conocer técnicas pre-operatorias y los conceptos teóricos y prácticos necesarios para un manejo adecuado de las mismas. El objetivo es dotar al alumno de las herramientas necesarias para realizar los procedimientos usados en la práctica quirúrgica incentivando al desarrollo de destrezas en la cirugía. Comprende el reconocimiento de los aspectos fisiopatológicos, su importancia y la consecuencia que pueden tener los errores que se cometan. Se tocan temas tales como: tipos de instalaciones, instrumentos y equipos utilizados en cirugía veterinaria moderna. Tipos de quirófano y mobiliario, instrumental quirúrgico, tipos y aplicación de suturas. Esterilización del material, preparativos quirúrgicos, conducta personal en el quirófano. Tipos de Anestesia. Anestesia inhalatoria, su uso y manejo, partes y ensamblaje del equipo. Manejo del dolor y pos-operatorio." },
  { name:"MV-0613 Practicas Pre-Profesional II", text:"Curso perteneciente al área de Formación Complementaria. Curso de naturaleza práctico que tiene como objetivo complementar la formación del alumno en los diferentes aspectos de la actividad veterinaria en el campo de su preferencia. El grado de responsabilidad en las prácticas está de acuerdo con el nivel de conocimiento alcanzado en las aulas." },
  { name:"MV-0614 Manejo de Fauna Silvestre", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo aplicar la teología y participar, como profesional médico veterinario en proyectos y planes de manejo de fauna silvestre en equipos multidisciplinarios. Comprende: introducción al manejo de animales silvestres. Manejo y control de poblaciones, crianza en cautiverio y semi cautiverio y técnicas de contención y alimentación de las especies silvestres más comunes de la fauna peruana. Reconoce la importancia de la conservación de la biodiversidad biológica." },
  { name:"MV-0704 Patología Veterinaria II", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo proporcionar un enfoque sistémico que se ocupa de las alteraciones ocurridas a nivel de células, órganos, aparatos y sistemas. Tiene por objetivo analizar y asociar las alteraciones y relacionarlas con sus causas dando lugar al diagnóstico, explicando los mecanismos de acción de las noxas en los procesos patológicos de sistemas en estudio. Trata sobre alteraciones y neoplasias del sistema respiratorio, sistema digestivo, cardiovascular y nervioso. Piel. Explica los mecanismos de acción en los procesos patológicos de los sistemas en estudio" },
  { name:"MV-0709 Epidemiología Veterinaria y Control de Zoonosis", text:"Curso perteneciente al área de Formación Profesional Especializada. El curso de naturaleza teórico- práctica tiene como objetivo proveer los conocimientos teórico-prácticos y su aplicación en el reconocimiento, caracterización, análisis y síntesis, frecuencia y distribución- de las enfermedades en poblaciones y los factores que intervienen en su presentación a fin de desarrollar políticas y estrategias que permitan su control o erradicación. Comprende unidades temáticas como perspectivas históricas de la relación Medicina Veterinaria - Epidemiología, Conceptos Epidemiológicos, Medicina Ecológica, la Investigación Epidemiológica y el Control y Erradicación de la enfermedad. Desarrolla criterios en el manejo de las enfermedades en poblaciones" },
  { name:"MV-0710 Patología Clinica Veterinaria", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo el estudio de los principios, técnicas y metodologías de la hematología, bioquímica sanguínea, microbiología y serología clínica, así como su aplicación en el entendimiento y diagnóstico clínico de las enfermedades en especies animales." },
  { name:"MV-0711 Control de Calidad e Inocuidad de los Alimentos", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo proporcionar a la población alimentos inocuos y de calidad nutritiva. Abarca temas tales como: responsabilidad de la profesión Médico Veterinaria sobre la Higiene Alimentaria, detección y determinación del origen y tipos de adulteración en los alimentos, relación de la Salud Pública Veterinaria en la prevención y control de las toxiinfecciones y de las zoonosis de origen alimentario. Desarrolla sensibilidad ante impactos que alteran la calidad de los alimentos y que afectan al medio ambiente." },
  { name:"MV-0712 Clinica Quirurgica de Animales Menores", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo capacitar en actividades y rutinas quirúrgicas y post quirúrgicas en animales menores. Trata temas como: Manejo quirúrgico de lesiones cutáneas específicas. Heridas y reconstrucción. Técnicas para el cierre de heridas y la colocación de drenes. Caudectomia en pacientes. Cirugía de los dedos y almohadillas podales. Cirugía del conducto auditivo del perro. Cirugía cavidad bucal y oro faringe. Cirugía abdominal. Cirugía del sistema digestivo. Cirugía torácica. Cirugía urogenital. Cirugía de sistema reproductor y genital. Cirugía del aparato reproductor femenino. Estimula la orientación clínica quirúrgica, reparativa y reconstructiva." },
  { name:"MV-0713 Semiología Veterinaria", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo proporcionar conocimientos y desarrollar habilidades y destrezas para analizar e interpretar correctamente los signos y síntomas fisiológicos y patológicos y presumir el diagnóstico y pronóstico del estado de salud de los animales." },
  { name:"MV-0714 Taller de Tesis", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo la aplicación de los conocimientos desarrollados en el curso de Formulación de Proyectos en Ciencias Veterinarias específicamente en la elaboración de proyectos de investigación que conduzcan a la realización de un trabajo de tesis para la consecución del título de médico veterinario. Es la integración de materias previas como la bioestadística, el diseño experimental y la metodología de la investigación para la elaboración y redacción un proyecto de investigación. Propicia la curiosidad y acuciosidad científica." },
  { name:"MV-0808 Etología y Bienestar Animal", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo entender la conducta animal en diversos entornos ambientales. Comprende la definición y ámbito de la etología, causas fisiológicas del comportamiento animal. La comunicación en los animales. Comportamiento a nivel individual y grupal. Comportamiento sexual y organización social y la evolución del comportamiento. Permite establecer medidas orientadas al bienestar animal Tiene como objetivo adquirir la capacidad de realizar análisis críticos respecto al Bienestar Animal desde diferentes perspectivas, para diferentes especies y en situaciones diversas, y poder reconocer sus implicaciones éticas y legales. Comprende conceptos de Bienestar Animal, su aplicación y define el rol del Médico Veterinario en el campo del Bienestar animal. Sensibiliza la tenencia y manejo responsable y humanitario de los animales." },
  { name:"MV-0809 Sanidad y Producción de cuyes y conejos", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo conocer el manejo productivo de cuyes y conejos en el país, integrando los conocimientos adquiridos en el desarrollo de la carrera. Comprende programas de sanidad, alimentación, plan de desarrollo, mejoramiento genético, producción y comercialización de productos y subproductos. Aplica conocimientos y experiencia para el mejoramiento de las razas y producción de cuyes y el desarrollo de la producción de carne de conejo y sus subproductos." },
  { name:"MV-0810 Diagnostico por Imagenes", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo aplicar tecnologías para el desarrollo de imágenes y su interpretación en el diagnóstico en la práctica clínica en medicina veterinaria. Comprende fundamentos de radiología y ecología, sus usos y aplicaciones. Diagnóstico y elaboración de informes Complementa la orientación clínica de los estudiantes." },
  { name:"MV-0811 Clinica Quirurgica de Animales Mayores", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo capacitar en actividades y rutinas quirúrgicas y post quirúrgicas en animales mayores. Trata temas como: heridas y reconstrucción, drenes, cirugía estética, abdominal y podal. Cirugía del sistema reproductor. Incentiva la orientación clínica terapéutica y reconstructiva." },
  { name:"MV-0812 Sanidad y Producción Acuicola", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo, comprender el estudio general de las metodologías y técnicas que se desarrollan en el cultivo de los recursos hidrobiológicos de importancia económica en aguas continentales. Adquisición de conocimientos aplicados y específicos sobre: Acuicultura y sistemas de producción en piscicultura. Las enfermedades más importantes que afectan a los peces en nuestro territorio. Diagnóstico, tratamiento y medidas de prevención y control. Y Las implicaciones de la piscicultura en la salud pública, seguridad alimentaria y en las múltiples interacciones con el medio ambiente." },
  { name:"MV-0813 Practica Pre-Profesional III", text:"Curso perteneciente al área de Formación Complementaria. Curso de naturaleza práctica que tiene como objetivo complementar la formación del alumno en los diferentes aspectos de la actividad veterinaria en el campo de su preferencia. El grado de responsabilidad en las prácticas está de acuerdo con el nivel de conocimiento alcanzado en las aulas." },
  { name:"MV-0814 Clinica de Animales Silvestres y Exoticos", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo brindar conocimientos y habilidades en el manejo y enfermedades de animales silvestres y exóticos. Inicio de las bases del manejo, nutricional, contención y cuidado durante la hospitalización de fauna silvestre y exótica. Desarrollo del Examen físico en diferentes especies de animales silvestres y exóticos incluyendo aves, reptiles y mamíferos, con énfasis en la fauna silvestre nacional. Herramientas para el diagnóstico clínico y radiológico, primeros auxilios incluyendo técnicas de administración de fluidos, triaje, vendajes y tratamientos. Familiarización con los diferentes protocolos de anestesia en diferentes especies de fauna silvestre y exótica." },
  { name:"MV-0908 Sanidad y Producción Avicola", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo integrar prácticas y programas de sanidad en el proceso productivo de aves de postura y producción de carne de diferentes grupos de aves de producción. Comprende sistemas técnicos de explotación de las especies domésticas de aves de postura y de carne bajo condiciones climáticas diferentes. Sistemas de producción. Características de crianza de aves. Reproductores. Incubación. Administración y economía de la producción avícola tecnificada. Desarrolla conceptos de calidad productiva integrando el componente sanidad o programas sanitarios en el proceso de la producción e industrialización de proteína animal. Características de crianza de aves. Reproductores. Incubación. Administración y economía de la producción avícola tecnificada. Integra el componente sanidad o programas sanitarios en el proceso de la producción e industrialización de proteína de origen animal." },
  { name:"MV-0910 Sanidad y Producción de Porcinos", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo conocer el manejo productivo del ganado porcino integrando los conocimientos adquiridos en el desarrollo de la carrera.  Comprende programas de sanidad,alimentación, plan de desarrollo, mejoramiento genético, producción y comercialización de productos y subproductos. Aplica conocimientos y experiencia para el desarrollo de la producción y comercialización de carne y subproductos de la especie porcina." },
  { name:"MV-0909 Salud Publica Veterinaria", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo la Promoción de la salud y de las condiciones para ser saludable. El estudiante desarrollará conocimientos para identificar la existencia de inequidades en salud y sus determinantes, las prioridades del gobierno y de la sociedad civil para reducirlas, y así contribuir a disminuir la pobreza y la mortalidad infantil, a fortalecer la protección e inocuidad de los alimentos, el control de las zoonosis y la prevención de la enfermedades crónicas y sociales." },
  { name:"MV-0912 Sanidad y Producción de Rumiantes Menores", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo conocer el manejo productivo de los camélidos sudamericanos, ovinos y caprinos. Integrando los conocimientos adquiridos en el desarrollo de la carrera. Comprende programas de sanidad, alimentación, plan de desarrollo, mejoramiento genético, producción y comercialización de productos y subproductos. Aplica conocimientos y experiencia para el desarrollo de la producción, mejoramiento genético e industrialización delos productos derivados de estas especies animales." },
  { name:"MV-0911 Sanidad y Producción de Bovinos", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo conocer el manejo productivo de bovinos productores de carne y de leche de importancia económica en el país, integrando los conocimientos adquiridos en el desarrollo de la carrera. Comprende programas de sanidad, alimentación, plan de desarrollo, mejoramiento genético, producción y comercialización de productos y subproductos. Aplica conocimientos y experiencia para el desarrollo de la producción e industria bovina de carne y leche." },
  { name:"MV-0913 Medicina de Animales de Compañia", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo capacitar al estudiante a identificar, resolver y manejar las principales enfermedades que se presentan, en la clínica diaria, en mascotas con énfasis en caninos y felinos. Comprende: identificación en el paciente los datos subjetivos y objetivos; examen físico, listado de problema, diagnósticos diferenciales, plan diagnóstico y terapéutico. Estimula la orientación clínica en animales menores." },
  { name:"MV-914 Sanidad y Producción de Equinos", text:"Curso perteneciente al área de Formación Profesional Especializada. Curso de naturaleza teórico- práctico que tiene como objetivo conocer el manejo productivo de équidos, integrando los conocimientos adquiridos en el desarrollo de la carrera. Comprende programas de sanidad, alimentación, plan de desarrollo, mejoramiento genético, producción y comercialización de productos y subproductos. Aplica conocimientos y experiencia para el desarrollo de la producción de équidos en el país." },
  { name:"MV-1009 Internado I", text:"Curso perteneciente al área de Formación Profesional Especializada. Estadio de naturaleza práctica que tiene como objetivo aplicar de forma integral los conocimientos adquiridos durante el período estudiantil de manera lógica y eficiente en el manejo y la clínica médica de las especies de animales Comprende prácticas de campo realizadas bajo la supervisión de profesionales especialistas en el área de la dependencia." },
  { name:"MV-1010 Internado II", text:"Curso perteneciente al área de Formación Profesional Especializada. Estadio de naturaleza práctica que tiene como objetivo aplicar de forma integral los conocimientos adquiridos durante el período estudiantil de manera lógica y eficiente en el manejo y la clínica médica de las especies de animales Comprende prácticas de campo realizadas bajo la supervisión de profesionales especialistas en el área de la dependencia." },
  { name:"MV-1011 Internado III", text:"Curso perteneciente al área de Formación Profesional Especializada. Estadio de naturaleza práctica que tiene como objetivo aplicar de forma integral los conocimientos adquiridos durante el período estudiantil de manera lógica y eficiente en el manejo y la clínica médica de las especies de animales Comprende prácticas de campo realizadas bajo la supervisión de profesionales especialistas en el área de la dependencia." },
  { name:"MV-1012 Internado IV", text:"Curso perteneciente al área de Formación Profesional Especializada. Estadio de naturaleza práctica que tiene como objetivo aplicar de forma integral los conocimientos adquiridos durante el período estudiantil de manera lógica y eficiente en el manejo y la clínica médica de las especies de animales Comprende prácticas de campo realizadas bajo la supervisión de profesionales especialistas en el área de la dependencia." },
  { name:"Acceso a la Información Científica Veterinaria", text:"Asignatura perteneciente al área de Formación Profesional Complementaria de naturaleza teórico-práctica que tributa con la competencia específica investigación. Tiene el propósito de desarrollar habilidades de búsqueda y análisis de información científica relevante en las ciencias de la salud. El contenido de la asignatura comprende el uso de herramientas digitales. Comprende la utilización de las bases de datos de científicas de libre acceso en línea y el reconocimiento de información científica de calidad, el uso de software para el manejo de citas bibliográficas y conocer las principales herramientas informáticas a utilizar durante el desarrollo de la carrera. Todas estas herramientas se utilizarán mediante el análisis de artículos científicos con el propósito de familiarizar al estudiante en el lenguaje científico en las ciencias veterinarias." },
  { name:"Urgencias Veterinarias", text:"Asignatura perteneciente al Área de Formación Profesional Especializada, de carácter teórico-práctico que tributa con la competencia especifica de salud animal. Tiene como propósito el desarrollo de habilidades de identificación de los diferentes tipos de urgencias y emergencias que se presentan en la práctica clínica veterinaria y los medios para lograr la estabilización y mantenimiento del paciente. El contenido de la asignatura comprende los conceptos generales de urgencias y emergencias, triaje, fluido terapia, tipos de shock y su manejo, resucitación cardiopulmonar, e manejo del dolor y el manejo de maniobras y procedimientos de emergencia según el sistema afectado; todo ellos dentro de un marco de una visión integral de la salud bajo la concepción de una educación humanística." },
  { name:"Principios Basicos de Cardiología Veterinaria", text:"Asignatura perteneciente al Área de Formación Profesional Complementaria, de carácter teórico-práctico que tributa con la competencia específica de salud animal. Tiene el propósito de desarrollar habilidades de análisis y evaluación de las enfermedades cardiovasculares en caninos y felinos, ejecutando técnicas diagnósticas, terapéuticas y medidas de prevención y control de las enfermedades más comunes en estas especies. El contenido de la asignatura comprende el desarrollo de los conceptos básicos de cardiología, la historia clínica del paciente cardiópata, sus signos clínicos, el análisis e interpretación de pruebas auxiliares para detectar pacientes cardiópatas como ECG y Ecocardiograma, tratamientos y maniobras a realizar en los pacientes cardiópatas y las principales enfermedades congénitas y adquiridas; todo ellos dentro de un marco de una visión integral de la salud." },
  { name:"Dermatología Veterinaria", text:"Asignatura perteneciente al área de Formación Complementaria de naturaleza teórico-práctica que tributa con la competencia específica de salud animal. Tiene el propósito de desarrollar habilidades de identificación y análisis de las principales enfermedades dermatológicas que se presentan en animales de compañía, así como el establecimiento de diagnósticos y tratamientos de dichas enfermedades. El contenido de la asignatura comprende la resolución de problemas en paciente con problemas de piel; así mismo se aplicarán técnicas y herramientas de diagnóstico en dermatología, el paciente alérgico, ectoparásito, dermatofitosis, endocrinas y autoinmunes; mediante el uso de técnicas como seminarios y análisis de casos prácticos de la realidad bajo la concepción de una educación humanística." },
  { name:"Etología clínica del perro y del gato", text:"Asignatura perteneciente al área de Formación Complementaria de naturaleza teórica práctica que tributa con la competencia especifica de salud animal. Tiene el propósito de desarrollar habilidades de análisis y caracterización de los principales grupos de conducta en caninos y felinos, su comportamiento social; estableciendo diagnósticos que permitan solucionar los problemas conductuales en estas especies. El contenido de la asignatura comprende el uso adecuado de los principios etológicos clínicos propios cuidando del bienestar de los perros y gatos domésticos tomando como base la metodología expositiva dialogada y de aprendizaje cooperativo mediante el uso de técnicas como seminarios y análisis de casos prácticos de la realidad bajo la concepción de una educación humanística." },
  { name:"Medicina de Felinos", text:"Asignatura perteneciente al Área de Formación Profesional Complementaria, de carácter teórico-práctico que tributa con la competencia especifica de salud animal. Tiene el propósito de desarrollar habilidades de análisis y evaluación de las enfermedades de los felinos, ejecutando técnicas diagnósticas, terapéuticas y medidas de prevención y control de las enfermedades más comunes en felinos. El contenido de la asignatura comprende los fundamentos básicos de la medicina felina involucrando anatomía y fisiología; la exploración clínica del gato, técnicas y procedimientos diagnósticos y exámenes auxiliares en la especie felina, enfermedades microbianas, congénitas y adquiridas de los felinos; el desarrollo de la historia clínica y la elaboración de estrategias terapéuticas; todo ellos dentro de un marco de una visión integral de la salud y de un profundo respeto a las normas éticas hacia los pacientes y sus propietarios." }

// PLAN SWITCHER
// ─────────────────────────────────────────────
let currentPlan = '24';

// build sumilla index for plan 52
const sumillaByCode52 = {};
sumillasData52.forEach(s => {
  const spaceIdx = s.name.indexOf(' ');
  if (spaceIdx > -1) {
    const code = s.name.substring(0, spaceIdx);
    sumillaByCode52[code] = s.text;
  }
});

function switchPlan(plan) {
  if (plan === currentPlan) return;
  currentPlan = plan;

  // update button states
  document.getElementById('btn24').classList.toggle('active', plan === '24');
  document.getElementById('btn52').classList.toggle('active', plan === '52');

  // update header badge
  document.querySelector('header p').textContent =
    plan === '24'
      ? 'Plan Curricular 2024 · Universidad Ricardo Palma'
      : 'Plan Curricular 52 · Universidad Ricardo Palma';

  // rebuild select options
  const activeComp = plan === '24' ? competencias : competencias52;
  allOpts = activeComp.map(c => ({ value: c.code + '||' + c.name, label: `${c.code} · ${c.name}` }));
  document.getElementById('searchInput').value = '';
  renderOptions(allOpts);

  // hide result area
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('emptyState').style.display = 'block';
}
