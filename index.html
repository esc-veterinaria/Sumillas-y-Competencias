<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Competencias · EPMV URP Plan 24</title>
<style>
  :root {
    --teal:#005f73; --teal2:#0a9396; --teal3:#94d2bd;
    --orange:#ee9b00; --orange2:#ca6702;
    --bg:#f0f9fa;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); min-height:100vh; color:#1e293b; }

  /* HEADER */
  header {
    background:linear-gradient(135deg,var(--teal) 0%,var(--teal2) 100%);
    color:#fff; padding:20px 32px; display:flex; align-items:center; gap:16px;
    box-shadow:0 2px 12px rgba(0,95,115,0.25);
  }
  header .logo { font-size:2rem; }
  header h1 { font-size:1.25rem; font-weight:800; letter-spacing:-0.01em; }
  header p { font-size:0.8rem; opacity:0.82; margin-top:2px; }
  header .badge {
    margin-left:auto; background:rgba(255,255,255,0.18);
    border:1.5px solid rgba(255,255,255,0.35); border-radius:20px;
    padding:5px 14px; font-size:0.75rem; font-weight:700; white-space:nowrap;
  }

  /* MAIN LAYOUT */
  main { max-width:960px; margin:0 auto; padding:28px 20px 48px; }

  /* SELECTOR CARD */
  .selector-card {
    background:#fff; border-radius:16px; padding:24px 28px;
    box-shadow:0 2px 14px rgba(0,95,115,0.1); margin-bottom:24px;
  }
  .selector-card label {
    display:block; font-size:0.78rem; font-weight:700;
    color:var(--teal); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;
  }
  .search-wrap { position:relative; margin-bottom:12px; }
  .search-wrap input {
    width:100%; padding:11px 14px 11px 40px;
    border:1.5px solid #d1d5db; border-radius:10px;
    font-size:0.9rem; outline:none; transition:border .15s;
    background:#fafafa;
  }
  .search-wrap input:focus { border-color:var(--teal2); background:#fff; }
  .search-wrap .icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:1rem; pointer-events:none; }

  select#asignaturaSelect {
    width:100%; padding:11px 14px; border:1.5px solid #d1d5db;
    border-radius:10px; font-size:0.88rem; outline:none;
    background:#fff; cursor:pointer; transition:border .15s;
    color:#1e293b;
  }
  select#asignaturaSelect:focus { border-color:var(--teal2); }
  select#asignaturaSelect option[disabled] { color:#9ca3af; }

  /* COUNTER */
  .count-hint { font-size:0.75rem; color:#9ca3af; margin-top:6px; }

  /* RESULT AREA */
  #resultArea { display:none; animation:fadeIn .35s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  /* COURSE HEADER BANNER */
  .course-banner {
    background:linear-gradient(135deg,var(--teal),var(--teal2));
    color:#fff; border-radius:14px; padding:18px 24px; margin-bottom:20px;
    display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap;
  }
  .course-banner .code-badge {
    background:rgba(255,255,255,0.2); border:1.5px solid rgba(255,255,255,0.35);
    border-radius:8px; padding:4px 12px; font-size:0.75rem; font-weight:800;
    letter-spacing:.04em; white-space:nowrap; flex-shrink:0; align-self:flex-start;
    margin-top:2px;
  }
  .course-banner .course-name { font-size:1.1rem; font-weight:800; line-height:1.3; }
  .course-banner .course-area { font-size:0.78rem; opacity:0.82; margin-top:3px; }

  /* GRID */
  .grid-3 { display:grid; grid-template-columns:1fr; gap:16px; }
  @media(min-width:640px) { .grid-3 { grid-template-columns:1fr 1fr; } }
  @media(min-width:820px) {
    .grid-top { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
    .card-full { grid-column:1/-1; }
  }

  /* INFO CARD */
  .info-card {
    background:#fff; border-radius:14px; padding:20px 22px;
    box-shadow:0 2px 10px rgba(0,95,115,0.08);
    border-top:4px solid var(--teal3);
  }
  .info-card.orange { border-top-color:var(--orange); }
  .info-card.green  { border-top-color:#22c55e; }
  .info-card.purple { border-top-color:#a855f7; }

  .card-title {
    display:flex; align-items:center; gap:8px;
    font-size:0.72rem; font-weight:800; text-transform:uppercase;
    letter-spacing:.07em; color:var(--teal); margin-bottom:12px;
  }
  .card-title.orange { color:var(--orange2); }
  .card-title.green  { color:#16a34a; }
  .card-title.purple { color:#7c3aed; }
  .card-title .dot {
    width:8px; height:8px; border-radius:50%; background:currentColor; flex-shrink:0;
  }

  /* SUMILLA */
  .sumilla-text {
    font-size:0.875rem; line-height:1.75; color:#374151;
    background:#f8fafc; border-radius:10px; padding:14px 16px;
    border-left:3px solid var(--teal3);
  }

  /* COMPETENCIAS LISTS */
  .comp-list { list-style:none; display:flex; flex-direction:column; gap:7px; }
  .comp-list li {
    display:flex; align-items:flex-start; gap:9px;
    font-size:0.85rem; color:#374151; line-height:1.45;
  }
  .comp-list li .bullet {
    width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:0.65rem; font-weight:800; flex-shrink:0; margin-top:1px;
    color:#fff;
  }
  .bullet-teal  { background:var(--teal2); }
  .bullet-orange{ background:var(--orange); }
  .bullet-empty { color:#9ca3af; font-style:italic; }

  /* LEVEL PILL */
  .level-pill {
    display:inline-block; font-size:0.7rem; font-weight:700;
    padding:2px 9px; border-radius:20px; margin-left:6px;
    vertical-align:middle;
  }
  .pill-1 { background:#dbeafe; color:#1d4ed8; }
  .pill-2 { background:#d1fae5; color:#065f46; }
  .pill-3 { background:#fef3c7; color:#92400e; }
  .pill-4 { background:#ede9fe; color:#5b21b6; }

  /* EMPTY STATE */
  .empty-state {
    text-align:center; padding:40px 20px; color:#9ca3af;
    font-size:0.9rem;
  }
  .empty-state .icon { font-size:2.5rem; display:block; margin-bottom:10px; }

  /* COPY BTN */
  .btn-copy {
    margin-top:12px; border:1.5px solid #d1d5db; background:#fff;
    color:#6b7280; border-radius:8px; padding:6px 14px; font-size:0.75rem;
    font-weight:600; cursor:pointer; transition:all .15s;
  }
  .btn-copy:hover { border-color:var(--teal2); color:var(--teal2); }

  /* TOAST */
  @keyframes slideUp { from{transform:translateY(60px);opacity:0} to{transform:translateY(0);opacity:1} }
  #toast {
    display:none; position:fixed; bottom:22px; right:22px; z-index:999;
    background:var(--teal); color:#fff; padding:11px 20px; border-radius:10px;
    font-weight:700; font-size:0.85rem; animation:slideUp .3s ease;
    box-shadow:0 4px 16px rgba(0,0,0,0.18);
  }

  /* PLAN TOGGLE */
  .plan-toggle {
    display:flex; gap:4px; background:rgba(255,255,255,0.15);
    border-radius:12px; padding:4px; align-self:center;
  }
  .ptbtn {
    padding:7px 18px; border-radius:9px; border:none; cursor:pointer;
    font-size:0.82rem; font-weight:800; letter-spacing:.02em;
    transition:all .2s; color:rgba(255,255,255,0.75); background:transparent;
  }
  .ptbtn.active {
    background:#fff; color:var(--teal); box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  .ptbtn:not(.active):hover { background:rgba(255,255,255,0.2); color:#fff; }

  /* plan badge pill in banner */
  .plan-pill {
    font-size:0.7rem; font-weight:800; padding:2px 10px; border-radius:20px;
    background:rgba(255,255,255,0.25); border:1.5px solid rgba(255,255,255,0.4);
    margin-left:8px; vertical-align:middle;
  }
</style>
</head>
<body>

<header>
  <span class="logo">🐾</span>
  <div>
    <h1>Mapa de Competencias · EPMV</h1>
    <p>Plan Curricular 2024 · Universidad Ricardo Palma</p>
  </div>
  <span class="badge">Plan 24</span>

  <div class="plan-toggle">
    <button class="ptbtn active" id="btn24" onclick="switchPlan('24')">Plan 24</button>
    <button class="ptbtn" id="btn52" onclick="switchPlan('52')">Plan 52</button>
  </div>
</header>

<main>

  <!-- SELECTOR -->
  <div class="selector-card">
    <label>Seleccionar Asignatura</label>
    <div class="search-wrap">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Filtrar por nombre o código…" autocomplete="off">
    </div>
    <select id="asignaturaSelect" size="1">
      <option value="" disabled selected>— Elige una asignatura —</option>
    </select>
    <div class="count-hint" id="countHint"></div>
  </div>

  <!-- RESULTADO -->
  <div id="resultArea">

    <!-- Banner de curso -->
    <div class="course-banner">
      <span class="code-badge" id="bannerCode"></span>
      <div>
        <div class="course-name" id="bannerName"></div>
        <div class="course-area" id="bannerArea"></div>
      </div>
    </div>

    <!-- Sumilla (full width) -->
    <div class="info-card" style="margin-bottom:16px;">
      <div class="card-title">
        <span class="dot"></span> Sumilla
      </div>
      <div class="sumilla-text" id="sumillaText"></div>
      <button class="btn-copy" onclick="copySumilla()">📋 Copiar sumilla</button>
    </div>

    <!-- Competencias grid -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
      <!-- Genéricas -->
      <div class="info-card orange">
        <div class="card-title orange">
          <span class="dot"></span> Competencias Genéricas
        </div>
        <ul class="comp-list" id="genericList"></ul>
      </div>
      <!-- Específicas -->
      <div class="info-card purple">
        <div class="card-title purple">
          <span class="dot"></span> Competencias Específicas
        </div>
        <ul class="comp-list" id="specificList"></ul>
      </div>
    </div>

  </div>

  <!-- EMPTY STATE inicial -->
  <div class="empty-state" id="emptyState">
    <span class="icon">📚</span>
    Selecciona una asignatura para ver su sumilla y competencias.
  </div>

</main>

<div id="toast"></div>

<script>
// ─────────────────────────────────────────────
// DATOS: SUMILLAS
// ─────────────────────────────────────────────
const sumillasData = [
  { name:"MV-0101 Manejo Veterinario", text:"Asignatura perteneciente al área de Formación Profesional Básica de naturaleza teórico- práctica, que tributa con las competencias específicas de salud animal y producción animal. Tiene como propósito el desarrollo de habilidades de identificación de las ramas de la medicina veterinaria y emplear técnicas de manejo básica en animales de compañía. El contenido de la asignatura comprende el análisis de las diferentes especialidades en medicina veterinaria, el desarrollo conceptos básicos en enfermería veterinaria y la adquisición de habilidades y destrezas en maniobras, procedimientos y protocolos básicos que se realizan en la práctica profesional mediante el uso de herramientas educativas como simuladores, equipos, así como análisis de casos en función de un trabajo colaborativo." },
  { name:"MV-0102 Introducción a las Ciencias Veterinarias", text:"La asignatura es de naturaleza Practica de carácter obligatorio de formación general. Aporta a las competencias genéricas de comportamiento ético y desarrollo del pensamiento crítico y creativo. Tiene el propósito de desarrollar habilidades de identificación y evaluación de una visión integral de la profesión médico veterinaria, proporcionándole conocimientos básicos sobre los objetivos de la carrera y las áreas de actividad medico veterinaria en un marco de interrelación ética con la comunidad y el medio ambiente." },
  { name:"MV-0103 Química", text:"Asignatura perteneciente al área de Formación Profesional Básica de naturaleza teórico-práctica, que tributa con la competencia específica de investigación. Tiene el propósito de desarrollar habilidades de identificación de estructuras y propiedades de la materia para entender sus características tanto de sustancias orgánicas e inorgánicas. El contenido de la asignatura comprende los conceptos básicos de la e importancia de la química, la estructura de la materia, la organización e interacción de las moléculas, las soluciones y principales compuestos orgánicos y la estructura de carbohidratos, aminoácidos y lípidos." },
  { name:"MV-0201 Bioquímica", text:"Curso perteneciente al área de Formación Profesional Básica de naturaleza teórico- práctico, que tributa con las competencias específicas de investigación y salud animal. Tiene el propósito de desarrollar habilidades de identificación de las estructuras moleculares y funciones de las diferentes biomoléculas. El contenido de la asignatura comprende el análisis de la estructura química, función y metabolismo de las biomoléculas como agua, proteínas, enzimas, carbohidratos, lípidos y compuesto nitrogenados, explicando las diversas funciones, procesos metabólicos, mecanismos de regulación y la interrelación entre ellos y el organismo animal, aplicando técnicas para su reconocimiento y valorando los procesos químicos de la materia viva." },
  { name:"MV-0202 Biología Celular", text:"Asignatura perteneciente al área de Formación Profesional Básica de naturaleza teórico-práctica, que tributa con la competencia específica de investigación. Tiene como propósito el desarrollo de habilidades de identificación de estructuras celulares y el análisis de la función del material genético. El contenido de la asignatura comprende el análisis de la estructura y composición química de la célula, las funciones básicas de los organismos, las reacciones vitales para dar origen a la vida; así mismo se comprenderá las funciones de las organelas en los diferentes procesos celulares aplicando técnicas para su reconocimiento y valoración; y la importancia de los ácidos nucleicos en la división celular y el comportamiento de la información genética." },
  { name:"MV-0301 Zootecnia General", text:"Asignatura perteneciente al área de Formación Profesional Básica de naturaleza teórico-práctica, que tributa a la competencia específica de producción animal. Tiene como propósito el desarrollar habilidades de identificación y manejo de los diferentes animales de producción. El contenido de la asignatura comprende los conceptos generales de Zootecnia, características de las diferentes especies y razas policavitarias y monocavitarias, así como de los pilares básicos de la producción animal tales como: alimentación, manejo, mejoramiento genético y sanidad; aplicando técnicas de manejo animal en sistema de producción, mejoramiento genético, nutrición y sanidad considerando el bienestar animal y el cuidado del medio ambiente." },
  { name:"MV-0302 Anatomía Veterinaria", text:"Curso perteneciente al área de Formación Profesional Básica, de naturaleza teórico- práctico, que tributa a las competencias específicas de salud animal y producción animal. Tiene el propósito de desarrollar habilidades de identificación de la estructura macroscópica de las diferentes estructuras que conforman la anatomía de los animales domésticos. El contenido de la asignatura comprende el análisis de los aspectos fundamentales de la morfología externa del cuerpo de los animales domésticos, la correlación funcional y clínica con la producción y salud animal; la organización anatómica de los sistemas corporales de los animales domésticos y los conceptos básicos de su funcionamiento. Aplicando técnicas de disección anatómica para cabeza y cuello, miembro torácico, tórax, abdomen, vísceras, pelvis, miembro pélvico y anexos." },
  { name:"MV-0303 Histología Animal", text:"Curso perteneciente al área de Formación Profesional Básica, de naturaleza teórico- práctico, que tributa con las competencias específicas de salud animal e investigación. Tiene el propósito de desarrollar habilidades de identificación de la estructura detallada de los tejidos fundamentales, sus variantes y sus relaciones permitiendo diferenciar los diversos órganos, aparatos y sistemas. El contenido de la asignatura comprende el estudio de la organización terminal y funcional bajo el aspecto microscópico de los diferentes tejidos de los animales domésticos, señalando las principales diferencias entre algunas especies. Aplicando técnicas de coloración de tejidos e identificación de estructuras para incentivar al estudio de la patología microscópica en la formación del Médico Veterinario basados en principios éticos y humanísticos." },
  { name:"MV-0304 Bioestadística", text:"Asignatura perteneciente al área de Formación Profesional Básica, de naturaleza teórico-práctico, que tributa a las competencias específicas de investigación y salud pública. Tiene el propósito de desarrollar habilidades de recolección, organización, análisis, interpretación y presentación de datos observados en fenómenos biológicos y sociales. El contenido de la asignatura comprende el reconocimiento y aplicación de los métodos de recolección, organización, análisis y presentación de resultados a partir de datos obtenidos de estudios relacionadas al campo de la salud animal, producción pecuaria y salud pública, como incentivo a la investigación y fuente confiable para la toma de decisiones." },
  { name:"MV-0401 Microbiología Veterinaria", text:"Asignatura perteneciente al área de Formación Profesional Especializada, con carácter teórico-práctico que tributa las competencias específicas de salud animal, salud pública e investigación. Tiene el propósito de desarrollar habilidades de identificación y diagnóstico de los principales agentes causantes de enfermedades en Medicina Veterinaria. El contenido de la asignatura comprende concepciones generales sobre la participación de los microorganismos en el mantenimiento de la vida en el planeta y nociones del rol de ellos en la biotecnología, induciendo a la investigación y al reconocimiento de los agentes microbianos y virus en la causalidad de las enfermedades infecciosas basados en principios éticos y humanísticos." },
  { name:"MV-0402 Inmunología Veterinaria", text:"Asignatura perteneciente al área de Formación Profesional Especializada de naturaleza teórico-práctica que tributa con las competencias específicas de salud animal, salud pública e investigación. Tiene el propósito de desarrollar habilidades de análisis y diagnóstico de los diversos mecanismos inmunológicos, tanto a nivel celular como humoral que presentan los organismos animales, así como la identificación y detección los procesos de resistencia de los animales a inmunógenos. El contenido de la asignatura comprende el estudio de la respuesta inmune, evolución del sistema inmunitario, reacción antígeno-anticuerpo, inmunoglobulinas, formación de los anticuerpos, complemento, hipersensibilidad y enfermedades autoinmunes. Aplicando técnicas y/o pruebas inmunológicas para el reconocimiento de antígenos y anticuerpos de importancia en la Medicina Veterinaria." },
  { name:"MV-0403 Deontología y Legislación Veterinaria", text:"Asignatura perteneciente al área de Formación Complementaria de naturaleza teórico que tributa con las competencias específicas de salud animal y producción animal. Tiene el propósito de desarrollar en el estudiante pensamiento crítico en el análisis de las normas ético-morales para el ejercicio de la Medicina Veterinaria. El contenido de la asignatura comprende el estudio del Código Deontológico del Médico Veterinario del Perú, del Estatuto del Colegio Médico Veterinario del Perú, la Ley de creación, del ejercicio de la profesión médica veterinaria y del profesional de la salud médico veterinario tomando como base la metodología expositiva dialogada, el análisis de casos y de aprendizaje cooperativo mediante el uso de técnicas como seminarios y análisis de casos de la realidad dentro de la concepción de una educación humanística." },
  { name:"MV-0404 Fisiología Animal", text:"Asignatura perteneciente al área de Formación Profesional Básica de naturaleza teórico- práctica, que tributa a las competencias específicas de salud animal, producción animal e investigación. Tiene el propósito de desarrollar habilidades de integrar los procesos fisiológicos de las funciones normales del cuerpo animal que regulan su coordinación, desarrollo y mantenimiento como base para su aplicación en las diversas áreas de la salud animal y producción animal. El contenido de la asignatura comprende el funcionamiento de los sistemas biológicos a nivel celular y molecular; así como el estudio molecular de la fisiología del sistema nervioso, sangre y derivados, fisiología del sistema cardiovascular, fisiología del sistema respiratorio, fisiología del sistema digestivo, fisiología del sistema renal y fisiología del sistema endocrino, utilizando técnicas in-vivo, in-vitro, simuladores y estudio de casos para su aplicación en la Medicina Veterinaria." },
  { name:"MV-0405 Alimentación y Nutrición Animal", text:"Asignatura perteneciente al área de Formación Profesional Especializada de naturaleza teórico-práctica, que tributa con la competencia específica de producción animal. Tiene el propósito de desarrollar habilidades de identificación y evaluación de las transformaciones bioquímicas de los alimentos, procesos metabólicos de nutrientes y alteraciones nutricionales. El contenido de la asignatura comprende el análisis de conceptos generales de alimentación y nutrición animal, los nutrientes y su metabolismo, nutrición, alimentación y enfermedades metabólicas de animales menores y mayores; alteraciones nutricionales que afectan la salud y producción animal, así como el uso adecuado de alimentos en la formulación de raciones según sus necesidades y el estado fisiológico en que se encuentre infecciosas basados en principios éticos y humanísticos." },
  { name:"MV-0406 Diseño Estadístico", text:"Asignatura perteneciente al área de Formación Profesional Básica de naturaleza teórico-práctica que tributa al logro de la competencia especifica de investigación y salud pública. Tiene el propósito de desarrollar habilidades para el reconocimiento y diseño de los diferentes modelos de estudios de investigación observacionales y experimentales. El contenido de la asignatura comprende el concepto de investigación, los tipos de estudios de investigación, la descripción de los diversos diseños de estudios observacionales y experimentales, cálculo del tamaño de la muestra, desarrollo demostrativo de las pruebas de significación estadística y su interpretación que estimule el interés investigativo del estudiante." },
  { name:"MV-0501 Patología Veterinaria I", text:"Asignatura perteneciente al área de Formación Profesional Especializada de naturaleza teórico-práctica, que tributa con las competencias específicas de salud animal y producción animal. Tiene el propósito de desarrollar habilidades de identificación y análisis de las alteraciones que tienen lugar en las células y los tejidos desde el comienzo de la acción lesiva de un agente hasta la aparición de los cambios morfológicos observables de los animales domésticos. El contenido de la asignatura comprende los conceptos básicos de la patología, las alteraciones celulares, los procesos inflamatorios y las neoplasias de los diferentes sistemas biológicos, utilizando técnicas de diagnóstico microscópico y macroscópico." },
  { name:"MV-0502 Control de Calidad e Inocuidad de los Alimentos", text:"Asignatura perteneciente al área de Formación Profesional Especializada de naturaleza teórico-práctico, que tributa con las competencias específicas de salud pública e investigación. Tiene el propósito de desarrollar habilidades de evaluación de la calidad e inocuidad de los alimentos de origen animal lo que incluye el dictamen a realizar respecto al destino de estos alimentos, de acuerdo con la legislación vigente y con un enfoque preventivo e integral en la cadena de alimentos. El contenido de la asignatura comprende los conceptos generales de la legislación Sanitaria Nacional e internacional, control de calidad, inocuidad, procesos HACCP; utilizando técnicas de diagnóstico macroscópico y microscópico para asegurar la calidad de los alimentos." },
  { name:"MV-0503 Farmacología y Toxicología Veterinaria", text:"Asignatura perteneciente al área de Formación Profesional Especializada, de naturaleza teórico-práctico, que tributa con las competencias específicas de salud animal e investigación. Tiene el propósito de identificar los principales fármacos y tóxicos en medicina veterinaria y la creación de protocolos terapéuticos para las diferentes enfermedades. El contenido de la asignatura comprende los conceptos generales de la farmacología y toxicología, así como los fármacos empleados en los sistemas cardiovascular, digestivo, respiratorio, renal; los fármacos antimicrobianos y los antídotos para las principales intoxicaciones en medicina veterinaria; utilizando técnicas in-vivo, in-vitro, simuladores y estudio de casos para su aplicación en la Medicina Veterinaria." },
  { name:"MV-0504 Patología Clínica Veterinaria", text:"Asignatura perteneciente al área de Formación Profesional Especializada, con carácter teórico-práctico que tributa con las competencias específicas de salud animal e investigación. Tiene el propósito de desarrollar habilidades de distinguir y valorar las diferentes alteraciones en los análisis clínicos de los animales. El contenido de la asignatura comprende el estudio de los principios, técnicas y metodologías de la hematología, bioquímica sanguínea, microbiología y serología clínica, así como su aplicación en el entendimiento y diagnóstico clínico de las enfermedades en especies animales basados en principios éticos y humanísticos." },
  { name:"MV-0505 Semiología Veterinaria", text:"Curso perteneciente al área de Formación Profesional Especializada, de naturaleza teórico-práctico que tributa con las competencias específicas de sanidad animal y producción animal. Tiene el propósito de desarrollar habilidades para la exploración ordenada y sistemática de los animales domésticos y sus cambios fisiopatológicos; el contenido de la asignatura comprende los métodos generales de exploración física, el examen clínico por sistemas, métodos de sujeción físicos y químicos y los procesos para establecer diagnósticos del estado de salud en animales domésticos, con principios éticos y en armonía con el medio ambiente." },
  { name:"MV-0506 Biotecnología de la Reproducción y Mejoramiento Animal", text:"Asignatura perteneciente al área de Formación Profesional Básica de naturaleza teórico- práctico que tributa con las competencias específicas de investigación y producción animal. Tiene como propósito el desarrollo de habilidades identificación de individuos dentro de los parámetros productivos y aplicación de las técnicas de potenciamiento reproductivo. El contenido de la asignatura comprende la comprensión de las bases anatómicas y fisiológicas del aparato reproductor en animales domésticos, endocrinología de la reproducción, transporte y sobrevivencia de gametos, fertilización y tipos de placenta, métodos de mejoramiento animal y técnicas de biotecnologías reproductivas con la aplicación de métodos clásicos y modernos." },
  { name:"MV-0507 Experiencia Supervisada I", text:"Asignatura perteneciente al área de Formación Complementaria de naturaleza práctica que tributa con las competencias específicas de salud animal y producción animal. Tiene como propósito la aplicación de los conocimientos adquiridos para la realización del examen físico y emitir un diagnóstico presuntivo. El contenido de la asignatura comprende el concepto de anamnesis, examen físico y técnicas de diagnóstico mediante estudios de casos y el modelo dual." },
  { name:"MV-0601 Patología Veterinaria II", text:"Asignatura perteneciente al área de Formación Profesional Especializada de naturaleza teórico-práctica, que tributa con las competencias específicas de salud animal y producción animal. Tiene el propósito de desarrollar habilidades de identificación y análisis de las alteraciones que tienen lugar en los diferentes sistemas causados por diferentes agentes infecciosos incluyendo los mecanismos fisiopatológicos. El contenido de la asignatura comprende el estudio de la etiología, patogenia, correlación anatomo-clínica de las alteraciones patológicas y neoplasias del sistema respiratorio, sistema digestivo, cardiovascular, nervioso y piel; utilizando técnicas de diagnóstico microscópico y macroscópico." },
  { name:"MV-0602 Diagnóstico por Imágenes", text:"Asignatura perteneciente al área de Formación Profesional Especializada de naturaleza teórico-práctico, que tributa con la competencia especifica de sanidad animal. Tiene como propósito el desarrollo de habilidades de identificación y diagnóstico de las principales alteraciones anatómicas y fisiológicas de los animales mediante las técnicas radiológicas y ecográficas. El contenido de la asignatura comprende los conceptos generales de la imagenología, técnica e interpretación de las imágenes obtenidas por radiología y ecografía de los sistemas cardiovascular, respiratorio, renal, digestivo, reproductor, endocrino, técnicas de biopsia por ecografía para la aproximación diagnóstica tomando como base el uso de metodologías cooperativas participativas." },
  { name:"MV-0603 Etología y Bienestar Animal", text:"Asignatura perteneciente al área de Formación Profesional Especializada de naturaleza teórico- práctica que tributa al logro de las competencias específicas de salud animal y producción animal. Tiene el propósito de desarrollar habilidades para el análisis del comportamiento y conducta animal, el desarrollo de los mismos y el proceso del aprendizaje en base al cumplimiento del bienestar animal. El contenido de la asignatura comprende el uso adecuado de los principios etológicos de la especie, las casusas fisiológicas del comportamiento individual o grupal, comportamiento sexual y de organización social, la aplicación de los conceptos de bienestar animal y el rol del Médico Veterinario en el campo del bienestar animal; utilizando técnicas observacionales como el etograma, seminarios y análisis de casos." },
  { name:"MV-0604 Anestesiología y Preoperatoria", text:"Asignatura perteneciente al área de formación Profesional Especializada de naturaleza Teórico–Práctico, que tributa con la competencia especifica de salud animal. Tiene como propósito el desarrollo de habilidades evaluación y justificación de las diferentes estrategias anestésicas empleadas en animales, así como la adaptación de estas para las diferentes patologías que presentan los animales. El contenido de la asignatura comprende el manejo de los principales aspectos fisiopatológicos de la anestesia, su monitoreo y repercusión en el paciente; identificación de instalaciones y equipos de instrumental quirúrgico utilizados en cirugía veterinaria moderna, el manejo preoperatorio, la esterilización del material quirúrgico, preparativos quirúrgicos, conducta personal en el quirófano, manejo y uso de los tipos de anestesia, manejo del dolor y posoperatorio bajo la concepción de una educación humanística." },
  { name:"MV-0605 Obstetricia y Enfermedades Reproductivas", text:"Asignatura perteneciente al área de formación profesional especializada, teórico- práctico; que tributa con las competencias específicas de sanidad animal y producción animal. Tiene como propósito el desarrollo de habilidades de diagnóstico y resolución de los procesos fisiopatológicos reproductivos en los animales. El contenido de la asignatura comprende los conocimientos básicos y clínicos de las características endocrinas, funcionales y patológicas del aparato genital de los animales, así como su repercusión sobre la fertilidad y manejo reproductivo, la influencia del medio ambiente sobre la fertilidad y fecundidad animal, tratamientos terapéuticos/profilácticos según cada patología, mediante métodos de aprendizaje como estudio de casos y seminarios, manteniendo la ética profesional." },
  { name:"MV-0606 Parasitología y Enfermedades Parasitarias", text:"Asignatura perteneciente al área de formación profesional especializada, teórico- práctico que tributa con las competencias específicas de salud pública, sanidad animal e investigación. Tiene el propósito el desarrollo de habilidades para identificar el parasitismo como asociación biológica y la acción patogénica que ejercen en la salud pública o el ambiente. El contenido de la asignatura comprende el estudio de las enfermedades producidas por parásitos en relación a su etiología, identificación, ciclo biológico, epidemiologia, fisiopatología, respuesta inmune, e importancia en salud pública. Utilizando técnicas de diagnóstico microscópico y macroscópico." },
  { name:"MV-0607 Anatomía Comparada", text:"Asignatura perteneciente al área de Formación Profesional Complementaria de naturaleza teórico-práctica, que tributa con las competencias específicas de Salud Animal y Producción animal. Tiene el propósito de desarrollar habilidades de identificación de la estructura externa e interna de animales vertebrados e invertebrados estableciendo semejanzas y diferencias de entre estos seres vivos. El contenido de la asignatura comprende los conocimientos de modelos de la morfología de los animales de importancia en las ciencias veterinarias, de los principios básicos de la función de sus sistemas corporales y de su desarrollo embrionario, analizando las similitudes y diferencias en la evolución de los animales. Comparando su origen, clasificación y características en base a los sistemas orgánicos, así como sus principios fisiológicos." },
  { name:"MV-0608 Acceso a la Información Científica Veterinaria", text:"Asignatura perteneciente al área de Formación Profesional Complementaria de naturaleza teórico-práctica que tributa con la competencia específica investigación. Tiene el propósito de desarrollar habilidades de búsqueda y análisis de información científica relevante en las ciencias de la salud. El contenido de la asignatura comprende el uso de herramientas digitales. Comprende la utilización de las bases de datos de científicas de libre acceso en línea y el reconocimiento de información científica de calidad, el uso de software para el manejo de citas bibliográficas y conocer las principales herramientas informáticas a utilizar durante el desarrollo de la carrera. Todas estas herramientas se utilizarán mediante el análisis de artículos científicos con el propósito de familiarizar al estudiante en el lenguaje científico en las ciencias veterinarias." },
  { name:"MV-0609 Terapéutica Veterinaria", text:"Asignatura perteneciente al área de Formación complementaria de naturaleza teórico- práctico que tributa con la competencia especifica salud animal. Tiene el propósito de desarrollar habilidades de análisis, adaptación y justificación de estrategias terapéuticas para la resolución de las diversas enfermedades en los animales. El contenido de la asignatura comprende el análisis de diferentes técnicas terapéuticas farmacológicas endógenas y exógenas en medicina veterinaria; los riesgos de las terapias inadecuadas y iatrogenias, interiorizando el concepto de prescripción y dosificación adecuada. Así mismos conceptos avanzados de farmacología clínica por sistemas y terapia con antimicrobianos." },
  { name:"MV-0610 Urgencias Veterinarias", text:"Asignatura perteneciente al Área de Formación Profesional Especializada, de carácter teórico-práctico que tributa con la competencia especifica de salud animal. Tiene como propósito el desarrollo de habilidades de identificación de los diferentes tipos de urgencias y emergencias que se presentan en la práctica clínica veterinaria y los medios para lograr la estabilización y mantenimiento del paciente. El contenido de la asignatura comprende los conceptos generales de urgencias y emergencias, triaje, fluido terapia, tipos de shock y su manejo, resucitación cardiopulmonar, el manejo del dolor y el manejo de maniobras y procedimientos de emergencia según el sistema afectado." },
  { name:"MV-0701 Sanidad y Producción de cuyes y conejos", text:"Asignatura perteneciente al área de Formación Profesional Especializada de naturaleza teórico-práctico que tributa con las competencias específicas de producción animal, salud animal e investigación. Tiene el propósito de desarrollar habilidades de creación y ejecución de actividades de manejo productivo y reproductivo en cuyes y conejos; así mismo identificar, prevenir y controlar las enfermedades potenciales en su crianza. El contenido de la asignatura comprende los conceptos de sistemas productivos de cuyes y conejos, programas de sanidad, alimentación, plan de desarrollo, mejoramiento genético de razas, producción y comercialización de productos y subproductos de carne de cuy y conejo." },
  { name:"MV-0702 Metodología de la Investigación", text:"Asignatura perteneciente al área de Formación Profesional Básica de naturaleza teórico- práctica que tributa con la competencia especifica de investigación. Tiene el propósito de desarrollar habilidades de análisis, creación y valoración de un proyecto de investigación en ciencias de la salud. El contenido de la asignatura comprende la teoría, las bases metodológicas y epistemológicas, las fases del proceso investigación científica, la identificación del problema, el planteamiento del problema, el marco teórico, la formulación de hipótesis, el diseño metodológico y los demás enfoques teóricos más importantes acorde a los principios éticos de la investigación." },
  { name:"MV-0703 Enfermedades Infecciosas de los Animales Domésticos", text:"Asignatura perteneciente al área de Formación Profesional Especializada de naturaleza teórico-práctica que tributa con las competencias específicas de salud animal y salud pública. Tiene como propósito el desarrollo de habilidades de identificación de las principales enfermedades infecciosas que se producen en los animales, así como la evaluación y adaptación de estrategias para su prevención y control." },
  { name:"MV-0704 Clínica Quirúrgica de Animales Menores", text:"Asignatura perteneciente al Área de Formación Profesional Especializada, de carácter teórico-práctico que tributa con la competencia especifica de salud animal. Tiene el propósito de desarrollar habilidades de planificación, evaluación de un paciente con patología quirúrgica y ejecutar un manejo quirúrgico que asegure el bienestar animal. El contenido de la asignatura comprende los conceptos de asepsia y antisepsia, los diferentes tipos de suturas, anestesia, analgesia y los procedimientos terapéuticos y quirúrgicos necesarios para las patologías quirúrgicas más frecuentes." },
  { name:"MV-0705 Clínica de Animales Silvestres y Exóticos", text:"Asignatura perteneciente al Área de Formación Profesional Especializada, de carácter teórico-práctico que tributa con la competencia especifica de salud animal. Tiene el propósito de desarrollar habilidades de identificar, prevenir y controlar las diversas patologías presentadas por los animales silvestres y exóticos, así como utilizar el manejo correcto de los animales silvestres y exóticas." },
  { name:"MV-0706 Patología Aviar", text:"Asignatura perteneciente al área de Formación complementaria de naturaleza teórico- práctico que tributa con las competencias específicas de salud animal e investigación. Tiene el propósito de desarrollar habilidades de identificación de las alteraciones orgánicas y sistémicas que suceden en las aves, ejecutando estrategias de diagnóstico para su aplicación clínica. El contenido de la asignatura comprende el desarrollo de las principales enfermedades de aves domésticas y silvestres de carácter infeccioso, nutricional, parasitaria, metabólicas, genéticas y de manejo." },
  { name:"MV-0707 Experiencia Supervisada II", text:"Asignatura perteneciente al área de Formación Complementaria de naturaleza práctica que tributa con las competencias específicas de salud animal y producción animal. Tiene como propósito la aplicación de los conocimientos adquiridos para la emisión de diagnósticos presuntivos y definitivos, y la aplicación de terapias farmacológicas en animales menores y mayores. El contenido de la asignatura comprende el examen físico, fisiopatología de las enfermedades, pruebas diagnósticas y terapéutica mediante medicina basada en evidencia, estudios de casos y el modelo dual." },
  { name:"MV-0801 Sanidad y Producción Avícola", text:"Asignatura perteneciente al área de Formación Profesional Especializada, de naturaleza teórico – práctico que tributa con las competencias específicas de salud animal y producción animal. Tiene como propósito el desarrollo de habilidades de evaluación de los diferentes sistemas de producción avícola, así mismo el análisis y la evaluación de las enfermedades más comunes en aves, ejecutando técnicas diagnósticas, terapéuticas, medidas de prevención y control de las enfermedades." },
  { name:"MV-0802 Epidemiología Veterinaria", text:"Asignatura perteneciente al área de Formación Profesional Especializada de naturaleza teórico-práctico que tributa con las competencias específicas de salud pública y salud animal. Tiene el propósito de desarrollar habilidades de identificar, analizar y medir los principales factores de las enfermedades en poblaciones y los como intervienen en su aparición con el fin de desarrollar estrategias que permitan su control o erradicación." },
  { name:"MV-0803 Taller de Investigación I", text:"Asignatura perteneciente al área de Formación Profesional Básica de naturaleza teórico- práctica que tributa con la competencia especifica de investigación. Tiene como propósito de aplicar conocimientos, métodos, procedimientos y estándares de la investigación científica/tecnológica, en proyectos de investigación relacionados con las líneas de investigación de la Medicina Veterinaria." },
  { name:"MV-0804 Clínica Quirúrgica de Animales Mayores", text:"Asignatura correspondiente al área de formación profesional especializada de carácter teórico- práctico que tributa con las competencias específicas de salud animal y producción animal. Tiene el propósito de desarrollar habilidades de planificación, evaluación de un paciente con patología quirúrgica y ejecutar un manejo quirúrgico que asegure el bienestar de los grandes animales." },
  { name:"MV-0805 Sanidad y Producción Acuícola", text:"Asignatura perteneciente al área de formación profesional especializada, de naturaleza teórico–práctico que tributa con las competencias específicas de salud animal y producción animal. Tiene el propósito de desarrollar habilidades de evaluar y medir la mejora continua del cultivo sobre los sistemas de producción en acuicultura, identificando los principales patógenos que afectan a los organismos acuáticos y la aplicación de técnicas de prevención, diagnóstico y control de las enfermedades más comunes." },
  { name:"MV-0806 Sanidad y Producción de Rumiantes Menores", text:"Asignatura perteneciente al área de formación Profesional Especializada de naturaleza teórico-práctica, que tributa con las competencias específicas de salud animal y producción animal. Tiene el propósito de desarrollar habilidades de identificación y evaluación de los diferentes sistemas de producción en rumiantes menores, comprendiendo el manejo y el flujo productivo, así mismo el análisis y la evaluación de las enfermedades más comunes de los rumiantes menores." },
  { name:"MV-0807 Medicina de Felinos", text:"Asignatura perteneciente al Área de Formación Profesional Complementaria, de carácter teórico-práctico que tributa con la competencia especifica de salud animal. Tiene el propósito de desarrollar habilidades de análisis y evaluación de las enfermedades de los felinos, ejecutando técnicas diagnósticas, terapéuticas y medidas de prevención y control de las enfermedades más comunes en felinos." },
  { name:"MV-0808 Etología Clínica del Perro y el Gato", text:"Asignatura perteneciente al área de Formación Complementaria de naturaleza teórica práctica que tributa con la competencia especifica de salud animal. Tiene el propósito de desarrollar habilidades de análisis y caracterización de los principales grupos de conducta en caninos y felinos, su comportamiento social; estableciendo diagnósticos que permitan solucionar los problemas conductuales en estas especies." },
  { name:"MV-0809 Dermatología Veterinaria", text:"Asignatura perteneciente al área de Formación Complementaria de naturaleza teórico-práctica que tributa con la competencia específica de salud animal. Tiene el propósito de desarrollar habilidades de identificación y análisis de las principales enfermedades dermatológicas que se presentan en animales de compañía, así como el establecimiento de diagnósticos y tratamientos de dichas enfermedades." },
  { name:"MV-0810 Principios Básicos de Cardiología Veterinaria", text:"Asignatura perteneciente al Área de Formación Profesional Complementaria, de carácter teórico-práctico que tributa con la competencia específica de salud animal. Tiene el propósito de desarrollar habilidades de análisis y evaluación de las enfermedades cardiovasculares en caninos y felinos, ejecutando técnicas diagnósticas, terapéuticas y medidas de prevención y control de las enfermedades más comunes en estas especies." },
  { name:"MV-0811 Oftalmología Veterinaria", text:"Asignatura perteneciente al área de Formación Complementaria de naturaleza teórica práctica que tributa con la competencia específica de salud animal. Tiene el propósito de desarrollar habilidades análisis y evaluación de las enfermedades oftálmicas en caninos y felinos, ejecutando técnicas diagnósticas, terapéuticas y medidas de prevención y control de las enfermedades más comunes." },
  { name:"MV-0901 Taller de Investigación II", text:"Asignatura perteneciente al área de Formación Profesional Básica de naturaleza teórico- práctica que tributa con la competencia especifica de investigación. Tiene como propósito el desarrollo de habilidades de investigación científica/tecnológica, en proyectos de investigación relacionados con las líneas de investigación de la Medicina Veterinaria." },
  { name:"MV-0902 Gestión y Administración Veterinaria", text:"Asignatura perteneciente al área de Formación Profesional Especializada de naturaleza teórico práctico que tributa con la competencia especifica de producción animal. Tiene el propósito de desarrollar habilidades de análisis y aplicación de los aspectos básicos de los costos, contabilidad y administración aplicadas a los campos de las Ciencias Veterinarias para una gestión empresarial eficiente." },
  { name:"MV-0903 Sanidad y Producción de Porcinos", text:"Asignatura perteneciente al área de Formación Profesional Especializada, de naturaleza teórico – práctico que tributa con las competencias específicas de salud animal y producción animal. Tiene el propósito de desarrollar habilidades de evaluación de los diferentes sistemas de producción porcina, así mismo el análisis y la evaluación de las enfermedades más comunes en porcinos, ejecutando técnicas diagnósticas, terapéuticas, medidas de prevención y control de las enfermedades." },
  { name:"MV-0904 Sanidad y Producción de Bovinos", text:"Asignatura correspondiente al área de formación profesional especializada de naturaleza teórico – práctico que tributa con las competencias específicas de salud animal y producción animal. Tiene el propósito de desarrollar habilidades de evaluación de los diferentes sistemas de producción bovina de carne y leche, así mismo el análisis y la evaluación de las enfermedades más comunes en bovinos." },
  { name:"MV-0905 Medicina de Animales de Compañía", text:"Asignatura perteneciente al área de formación Profesional Especializada de naturaleza Teórico – Práctica, que tributa con la competencia especifica de salud animal. Tiene el propósito de desarrollar habilidades de análisis y evaluación de las enfermedades de los caninos y felinos, ejecutando técnicas diagnósticas, terapéuticas y medidas de prevención y control de las enfermedades más comunes en caninos y felinos." },
  { name:"MV-0906 Salud Pública Veterinaria", text:"Asignatura perteneciente al área de formación Profesional Especializada de naturaleza teórico-práctico que tributa con la competencia especifica de salud pública. Tiene el propósito de desarrollar habilidades de identificación, análisis y evaluación de los principales problemas y enfermedades zoonóticas, alimentos o medio ambiente que afecten al ser humano." },
  { name:"MV-0907 Sanidad y Producción de Equinos", text:"Asignatura perteneciente al área de formación Profesional Especializada de naturaleza teórico – práctico que tributa con las competencias específicas de salud animal y producción animal. Tiene el propósito de desarrollar habilidades de evaluación de los diferentes sistemas de crianza equina, así mismo el análisis y la evaluación de las enfermedades más comunes en equinos, ejecutando técnicas diagnósticas, terapéuticas, medidas de prevención y control de las enfermedades." },
  { name:"MV-1001 Internado en Medicina Veterinaria", text:"Asignatura perteneciente al área de formación Profesional Especializada de naturaleza Práctico que tributa con las competencias específicas salud animal, salud pública, investigación y Producción animal. Tiene el propósito de aplicar y adaptar de forma integral los conocimientos adquiridos de manera lógica y eficiente en el manejo y la clínica médica de las diferentes especies, de importancia económica y social." }
];

// ─────────────────────────────────────────────
// POPULATE SELECT
// ─────────────────────────────────────────────
const sel = document.getElementById('asignaturaSelect');
let allOpts = competencias.map(c => ({ value: c.code + '||' + c.name, label: `${c.code} · ${c.name}` }));

function renderOptions(list) {
  sel.innerHTML = '<option value="" disabled selected>— Elige una asignatura —</option>';
  list.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.value;
    opt.textContent = o.label;
    sel.appendChild(opt);
  });
  document.getElementById('countHint').textContent =
    list.length === allOpts.length
      ? `${list.length} asignaturas disponibles`
      : `${list.length} resultado${list.length !== 1 ? 's' : ''}`;
}
renderOptions(allOpts);

// ─────────────────────────────────────────────
// FILTRO
// ─────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  const filtered = q
    ? allOpts.filter(o => o.label.toLowerCase().includes(q))
    : allOpts;
  renderOptions(filtered);
  if (filtered.length === 1) {
    sel.value = filtered[0].value;
    sel.dispatchEvent(new Event('change'));
  }
});

// ─────────────────────────────────────────────
// NIVEL PILL
// ─────────────────────────────────────────────
function levelPill(text) {
  const m = text.match(/Nivel\s+(\d)/i);
  if (!m) return '';
  const n = m[1];
  const cls = ['','pill-1','pill-2','pill-3','pill-4'][n] || 'pill-1';
  return `<span class="level-pill ${cls}">Nv. ${n}</span>`;
}

// ─────────────────────────────────────────────
// ON CHANGE
// ─────────────────────────────────────────────
sel.addEventListener('change', function() {
  const val = this.value;
  if (!val) return;
  // value may be "CODE||name" (after plan switch) or just code (plan 24 original)
  const parts = val.split('||');
  const code = parts[0];
  const selectedName = parts[1];

  const activeComp = currentPlan === '24' ? competencias : competencias52;
  const activeSumByCode = currentPlan === '24' ? sumillaByCode : sumillaByCode52;

  const course = selectedName
    ? activeComp.find(c => c.code === code && c.name === selectedName)
    : activeComp.find(c => c.code === code);
  if (!course) return;

  // Banner
  document.getElementById('bannerCode').textContent = course.code;
  document.getElementById('bannerName').textContent = course.name;
  const area = course.code.startsWith('EB') ? 'Estudios Generales' : 'Escuela Profesional de Medicina Veterinaria';
  document.getElementById('bannerArea').textContent = area + ' · Plan ' + currentPlan;

  // Sumilla
  const sumText = activeSumByCode[course.code];
  document.getElementById('sumillaText').textContent = sumText || 'Sumilla no disponible para esta asignatura.';

  // Competencias genéricas
  const gList = document.getElementById('genericList');
  gList.innerHTML = '';
  (course.generic.length ? course.generic : ['No aplica']).forEach((g, i) => {
    gList.innerHTML += `<li>
      <span class="bullet bullet-teal">${i+1}</span>
      <span>${g}</span>
    </li>`;
  });

  // Competencias específicas
  const sList = document.getElementById('specificList');
  sList.innerHTML = '';
  if (course.specific.length) {
    course.specific.forEach((s, i) => {
      sList.innerHTML += `<li>
        <span class="bullet bullet-orange">${i+1}</span>
        <span>${s} ${levelPill(s)}</span>
      </li>`;
    });
  } else {
    sList.innerHTML = `<li class="bullet-empty">Esta asignatura no tributa competencias específicas de la EPMV.</li>`;
  }

  // Mostrar resultado
  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('emptyState').style.display = 'none';
});

// ─────────────────────────────────────────────
// COPY SUMILLA
// ─────────────────────────────────────────────
function copySumilla() {
  const text = document.getElementById('sumillaText').textContent;
  navigator.clipboard.writeText(text)
    .then(() => showToast('📋 Sumilla copiada'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast('📋 Sumilla copiada');
    });
}

let _toastT;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(_toastT);
  _toastT = setTimeout(() => { t.style.display = 'none'; }, 2800);
}
